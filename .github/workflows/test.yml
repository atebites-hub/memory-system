name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure jq
        run: command -v jq >/dev/null || { if [ "$RUNNER_OS" = macOS ]; then brew install jq; else sudo apt-get update && sudo apt-get install -y jq; fi; }
      - name: Tests
        run: /bin/bash tests/run.sh
